<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Smart Expense Tracker</h1>
        <p>Track your income and expenses in one place.</p>
      </header>

      <section class="panel">
        <h2 id="formTitle">Add Transaction</h2>

        <form id="transactionForm" class="transaction-form">
          <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" name="type" required>
              <option value="EXPENSE">Expense</option>
              <option value="INCOME">Income</option>
            </select>
          </div>

          <div class="form-group">
            <label for="amount">Amount (INR)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              step="0.01"
              placeholder="e.g. 250"
              required
            />
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              maxlength="255"
              placeholder="e.g. Groceries"
              required
            />
          </div>

          <div class="form-group">
            <label for="transactionDate">Date</label>
            <input
              type="date"
              id="transactionDate"
              name="transactionDate"
              required
            />
          </div>

          <div class="form-actions">
            <button type="submit" id="submitButton">Save Transaction</button>
            <button
              type="button"
              id="cancelEditButton"
              class="secondary-button"
              hidden
            >
              Cancel Edit
            </button>
          </div>
        </form>

        <p
          id="formMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <section class="summary-section">
        <h2>Transaction Summary</h2>

        <div class="summary-cards">
          <article class="summary-card">
            <h3>Total Income</h3>
            <p id="totalIncome">₹0.00</p>
          </article>

          <article class="summary-card">
            <h3>Total Expenses</h3>
            <p id="totalExpenses">₹0.00</p>
          </article>

          <article class="summary-card">
            <h3>Balance</h3>
            <p id="balance">₹0.00</p>
          </article>
        </div>
      </section>

      <section class="transactions-section">
        <h2>Transactions</h2>

        <button type="button" id="loadTransactions">
          Refresh Transactions
        </button>

        <div class="transaction-filters">
          <input
            type="search"
            id="searchTransactions"
            placeholder="Search by description..."
            aria-label="Search transactions by description"
          />

          <select id="filterType" aria-label="Filter by transaction type">
            <option value="ALL">All Transactions</option>
            <option value="EXPENSE">Expenses Only</option>
            <option value="INCOME">Income Only</option>
          </select>

          <select id="sortOrder" aria-label="Sort transactions">
            <option value="NEWEST">Newest First</option>
            <option value="OLDEST">Oldest First</option>
            <option value="AMOUNT_HIGH">Amount: High to Low</option>
            <option value="AMOUNT_LOW">Amount: Low to High</option>
          </select>
        </div>

        <p id="listMessage" class="message" role="status"></p>
        <ul id="transactionList" class="transaction-list">
          <li class="empty-state">Loading transactions...</li>
        </ul>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
