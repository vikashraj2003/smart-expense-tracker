<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/api.js" defer></script>
    <script src="/js/dashboard.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL FINANCE</p>
        <h1>Smart Expense Tracker</h1>
      </div>
      <button id="logoutButton" class="button secondary" type="button">
        Log out
      </button>
    </header>

    <main class="container">
      <p id="message" class="message" role="status"></p>

      <section class="summary-grid">
        <article class="panel summary-card">
          <p class="muted">Total income</p>
          <h2 id="totalIncome">—</h2>
        </article>
        <article class="panel summary-card">
          <p class="muted">Total expenses</p>
          <h2 id="totalExpenses">—</h2>
        </article>
        <article class="panel summary-card">
          <p class="muted">Net balance</p>
          <h2 id="netBalance">—</h2>
        </article>
      </section>

      <section class="panel">
        <h2>Add transaction</h2>

        <form id="transactionForm" class="transaction-form">
          <div>
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="EXPENSE">Expense</option>
              <option value="INCOME">Income</option>
            </select>
          </div>

          <div>
            <label for="amount">Amount</label>
            <input
              id="amount"
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              required
            />
          </div>

          <div>
            <label for="currency">Currency</label>
            <select id="currency" name="currency" required>
              <option value="INR">INR</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
            </select>
          </div>

          <div>
            <label for="transactionDate">Date</label>
            <input
              id="transactionDate"
              name="transactionDate"
              type="date"
              required
            />
          </div>

          <div class="full-span">
            <label for="description">Description</label>
            <input
              id="description"
              name="description"
              maxlength="255"
              required
            />
          </div>

          <button class="button primary" type="submit">Save transaction</button>
        </form>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>Transactions</h2>
          <span id="transactionCount" class="muted">0 records</span>
        </div>

        <div class="filters">
          <input
            id="searchInput"
            type="search"
            placeholder="Search descriptions"
            aria-label="Search transactions"
          />

          <select id="typeFilter" aria-label="Filter by type">
            <option value="ALL">All types</option>
            <option value="INCOME">Income</option>
            <option value="EXPENSE">Expense</option>
          </select>

          <button id="refreshButton" class="button secondary" type="button">
            Refresh
          </button>
        </div>

        <p id="loading" class="muted">Loading transactions...</p>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Description</th>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="transactionList"></tbody>
          </table>
        </div>

        <p id="emptyMessage" class="muted" hidden>No transactions found.</p>
      </section>
    </main>
  </body>
</html>
